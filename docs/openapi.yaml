openapi: 3.0.3

info:
  title: MiniBlog API
  version: 1.0.0
  description: API REST para gestionar autores y publicaciones.

servers:
  - url: http://localhost:3000
    description: Servidor local

tags:
  - name: Authors
    description: Operaciones relacionadas con autores
  - name: Posts
    description: Operaciones relacionadas con publicaciones

components:
  schemas:
    Author:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Ana Pérez
        email:
          type: string
          format: email
          example: ana@example.com
        bio:
          type: string
          nullable: true
          example: Autora interesada en tecnología.
        created_at:
          type: string
          format: date-time

    Post:
      type: object
      properties:
        id:
          type: integer
          example: 1
        author_id:
          type: integer
          example: 1
        title:
          type: string
          example: Mi primer post
        content:
          type: string
          example: Contenido de la publicación.
        published:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time

paths:
  /authors:
    get:
      tags:
        - Authors
      summary: Listar todos los autores
      responses:
        "200":
          description: Lista de autores obtenida correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Author"
        "500":
          description: Error interno del servidor
    post:
      tags:
        - Authors
      summary: Crear un autor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
              properties:
                name:
                  type: string
                  example: Laura Díaz
                email:
                  type: string
                  format: email
                  example: laura@example.com
                bio:
                  type: string
                  nullable: true
                  example: Autora y desarrolladora backend.
      responses:
        "201":
          description: Autor creado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Author"
        "400":
          description: Datos inválidos o email duplicado
        "500":
          description: Error interno del servidor

  /authors/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador del autor
        schema:
          type: integer
          minimum: 1

    get:
      tags:
        - Authors
      summary: Obtener un autor por ID
      responses:
        "200":
          description: Autor encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Author"
        "400":
          description: ID inválido
        "404":
          description: Autor no encontrado
        "500":
          description: Error interno del servidor
    put:
      tags:
        - Authors
      summary: Actualizar un autor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
              properties:
                name:
                  type: string
                  example: Ana Pérez Actualizada
                email:
                  type: string
                  format: email
                  example: ana@example.com
                bio:
                  type: string
                  nullable: true
                  example: Biografía actualizada.
      responses:
        "200":
          description: Autor actualizado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Author"
        "400":
          description: Datos o ID inválidos
        "404":
          description: Autor no encontrado
        "500":
          description: Error interno del servidor

    delete:
      tags:
        - Authors
      summary: Eliminar un autor
      responses:
        "204":
          description: Autor eliminado correctamente
        "400":
          description: ID inválido
        "404":
          description: Autor no encontrado
        "500":
          description: Error interno del servidor

  /posts:
    get:
      tags:
        - Posts
      summary: Listar todos los posts
      responses:
        "200":
          description: Lista de posts obtenida correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"
        "500":
          description: Error interno del servidor

    post:
      tags:
        - Posts
      summary: Crear un post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - author_id
                - title
                - content
              properties:
                author_id:
                  type: integer
                  minimum: 1
                  example: 1
                title:
                  type: string
                  example: Nuevo post
                content:
                  type: string
                  example: Contenido del nuevo post.
                published:
                  type: boolean
                  default: false
                  example: false
      responses:
        "201":
          description: Post creado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          description: Datos inválidos o autor inexistente
        "500":
          description: Error interno del servidor

  /posts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador del post
        schema:
          type: integer
          minimum: 1

    get:
      tags:
        - Posts
      summary: Obtener un post por ID
      responses:
        "200":
          description: Post encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          description: ID inválido
        "404":
          description: Post no encontrado
        "500":
          description: Error interno del servidor

    put:
      tags:
        - Posts
      summary: Actualizar un post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - author_id
                - title
                - content
              properties:
                author_id:
                  type: integer
                  minimum: 1
                  example: 1
                title:
                  type: string
                  example: Título actualizado
                content:
                  type: string
                  example: Contenido actualizado.
                published:
                  type: boolean
                  default: false
                  example: true
      responses:
        "200":
          description: Post actualizado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          description: Datos, ID o autor inválidos
        "404":
          description: Post no encontrado
        "500":
          description: Error interno del servidor

    delete:
      tags:
        - Posts
      summary: Eliminar un post
      responses:
        "204":
          description: Post eliminado correctamente
        "400":
          description: ID inválido
        "404":
          description: Post no encontrado
        "500":
          description: Error interno del servidor

  /posts/author/{authorId}:
    parameters:
      - name: authorId
        in: path
        required: true
        description: Identificador del autor
        schema:
          type: integer
          minimum: 1

    get:
      tags:
        - Posts
      summary: Listar posts de un autor con sus datos
      responses:
        "200":
          description: Posts del autor obtenidos correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: "#/components/schemas/Post"
                    - type: object
                      properties:
                        author_name:
                          type: string
                          example: Ana Pérez
                        author_email:
                          type: string
                          format: email
                          example: ana@example.com
                        author_bio:
                          type: string
                          nullable: true
                          example: Autora interesada en tecnología.
        "400":
          description: ID de autor inválido
        "500":
          description: Error interno del servidor